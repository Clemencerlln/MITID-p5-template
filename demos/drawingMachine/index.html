<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧚🏻p5js🧚🏻</title>

    <link href="style.css" rel="stylesheet" />

    <!-- p5 libs -->
    <!-- librairies are added locally in case we don't have access to wifi -->
    <script src="libraries/p5.js"         type="text/javascript"></script>
    <script src="libraries/p5Sound.js"    type="text/javascript"></script>
    <!-- <script src="libs/matter.js"    type="text/javascript"></script> -->
    <!-- <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>-->
    
    <script src="script.js" type="text/javascript" defer></script>
</head>
<body>
    <main>
        <!-- p5 canvas is attached here -->
    </main>

    <div id="infos">
        <h2>Use your keyboard to move</h2>
        <div id="controls">

            <div class="control">
                <label for="color">🎨  change color</label>
                <input type="color" id="color"> 
            </div>
            
            <div class="control">
                <label for="size">📏  change size</label>
                <input 
                    type="range" 
                    id="size"
                    min="4"
                    max="30"
                    step="2">
            </div>

            <button id="reset" class="control">🗑️  reset canvas</button>
        </div>
    </div>

    

</body>
</html>
